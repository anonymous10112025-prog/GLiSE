[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GLiSE"
version = "1.0.0"
description = "A tool for collecting grey literature from various sources for software engineering."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "wxPython>=4.2.3",
    "python-dotenv>=1.2.1",
    "openai==2.7.1",
    "requests>=2.32.5",
    "tiktoken>=0.12.0",
    "joblib>=1.4.2",
    "beautifulsoup4>=4.12.2",
    "numpy>=2.3.4",
    "xgboost==3.0.4",
    "scikit-learn>=1.7.0"
]

[project.scripts]
glise = "app:main"

[tool.setuptools]
py-modules = ["app"]
packages = ["model", "view", "controller", "data"]

[tool.setuptools.package-data]
"*" = ["*.png", "*.txt", "*.json", "*.joblib"]
